<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="edaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4a7e7" />
      <stop offset="100%" stop-color="#7e57c2" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#edaBg)" stroke="#222" stroke-width="1.5" />
  
  <!-- Jupyter Notebook / Analysis Header -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="560" height="36" rx="4" fill="#141418" stroke="#2c2c34" />
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c4a7e7">anime_eda_pipeline.ipynb</text>
    <text x="544" y="22" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981">[Kernel: Python 3.11 · Finished]</text>
  </g>

  <!-- Left: Data Cleaning & Missing Values Summary -->
  <g transform="translate(20, 70)">
    <rect x="0" y="0" width="260" height="308" rx="6" fill="#111216" stroke="#25262c" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#eee">Data Cleaning &amp; Imputation</text>
    
    <!-- Code snippet block -->
    <rect x="12" y="38" width="236" height="74" rx="4" fill="#08080a" stroke="#1d1d24" />
    <text x="20" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#eab308"># Missing value imputation</text>
    <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#aaa">df['score'].fillna(df.groupby('genre')</text>
    <text x="20" y="80" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#aaa">    ['score'].transform('median'))</text>
    <text x="20" y="96" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10b981">✓ 1,420 missing rows cleaned</text>

    <!-- Metrics Cards -->
    <g transform="translate(12, 126)">
      <rect x="0" y="0" width="112" height="60" rx="4" fill="#17181f" stroke="#2a2b36" />
      <text x="10" y="20" font-family="'Inter', sans-serif" font-size="9" fill="#888">Raw Records</text>
      <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#fff">24,165</text>

      <rect x="124" y="0" width="112" height="60" rx="4" fill="#17181f" stroke="#2a2b36" />
      <text x="10" y="20" font-family="'Inter', sans-serif" font-size="9" fill="#888">Clean Features</text>
      <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#c4a7e7">18 cols</text>
    </g>

    <!-- Key Finding note -->
    <rect x="12" y="200" width="236" height="92" rx="4" fill="#15161d" stroke="#22232d" />
    <text x="10" y="20" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#ddd">Project Takeaway:</text>
    <text x="10" y="38" font-family="'Inter', sans-serif" font-size="8.5" fill="#999">"Instead of jumping into hype ML models,</text>
    <text x="10" y="52" font-family="'Inter', sans-serif" font-size="8.5" fill="#999">I spent the time mastering real data</text>
    <text x="10" y="66" font-family="'Inter', sans-serif" font-size="8.5" fill="#999">wrangling and visual verification."</text>
  </g>

  <!-- Right: Score Distribution & Scatter Visualization -->
  <g transform="translate(300, 70)">
    <rect x="0" y="0" width="280" height="308" rx="6" fill="#111216" stroke="#25262c" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#eee">Score vs. Popularity Distribution</text>

    <!-- Chart Axes -->
    <g transform="translate(30, 50)">
      <!-- Gridlines -->
      <line x1="0" y1="40" x2="220" y2="40" stroke="#1f2029" stroke-dasharray="2,2" />
      <line x1="0" y1="80" x2="220" y2="80" stroke="#1f2029" stroke-dasharray="2,2" />
      <line x1="0" y1="120" x2="220" y2="120" stroke="#1f2029" stroke-dasharray="2,2" />
      <line x1="0" y1="160" x2="220" y2="160" stroke="#1f2029" stroke-dasharray="2,2" />

      <!-- Y Axis & X Axis -->
      <line x1="0" y1="0" x2="0" y2="180" stroke="#444" stroke-width="1.5" />
      <line x1="0" y1="180" x2="220" y2="180" stroke="#444" stroke-width="1.5" />

      <!-- Distribution Bars / Histogram -->
      <rect x="15" y="140" width="18" height="40" fill="url(#barGrad)" rx="2" opacity="0.8" />
      <rect x="38" y="110" width="18" height="70" fill="url(#barGrad)" rx="2" opacity="0.8" />
      <rect x="61" y="60" width="18" height="120" fill="url(#barGrad)" rx="2" opacity="0.8" />
      <rect x="84" y="30" width="18" height="150" fill="url(#barGrad)" rx="2" opacity="0.8" />
      <rect x="107" y="55" width="18" height="125" fill="url(#barGrad)" rx="2" opacity="0.8" />
      <rect x="130" y="90" width="18" height="90" fill="url(#barGrad)" rx="2" opacity="0.8" />
      <rect x="153" y="135" width="18" height="45" fill="url(#barGrad)" rx="2" opacity="0.8" />
      <rect x="176" y="160" width="18" height="20" fill="url(#barGrad)" rx="2" opacity="0.8" />

      <!-- Scatter Trend Line -->
      <path d="M 15 150 Q 80 60, 190 20" fill="none" stroke="#38bdf8" stroke-width="2" />

      <!-- Axis Labels -->
      <text x="110" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#777">Score Rating (1 – 10)</text>
      <text x="-90" y="-12" transform="rotate(-90)" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#777">Frequency</text>
    </g>

    <!-- Completed Tag -->
    <rect x="16" y="265" width="248" height="28" rx="4" fill="#090a0d" stroke="#10b981" stroke-width="0.8" />
    <circle cx="28" cy="279" r="3.5" fill="#10b981" />
    <text x="40" y="282" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#eee">
