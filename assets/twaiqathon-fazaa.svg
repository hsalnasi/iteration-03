<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fazaaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#fazaaBg)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="560" height="46" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
  <text x="40" y="49" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="url(#primaryGrad)">Fazaa (فزعة)</text>
  <text x="145" y="49" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">TWAIQATHON PROTOTYPE</text>
  
  <!-- Badge -->
  <rect x="470" y="32" width="90" height="22" rx="11" fill="#1e293b" />
  <circle cx="482" cy="43" r="3.5" fill="#38bdf8" />
  <text x="492" y="46" font-family="'Inter', sans-serif" font-size="9" fill="#e2e8f0">Student Mesh</text>

  <!-- Left Column: Voice Assistant & Smart Notes OCR -->
  <g transform="translate(20, 80)">
    <!-- Voice Interaction Card -->
    <rect x="0" y="0" width="270" height="140" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Voice Assistant Intent</text>
    <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">"Need CS201 midterms notes from senior..."</text>
    
    <!-- Audio Waveform Graphic -->
    <g transform="translate(16, 60)">
      <rect x="0" y="10" width="4" height="20" rx="2" fill="#38bdf8" />
      <rect x="8" y="4" width="4" height="32" rx="2" fill="#818cf8" />
      <rect x="16" y="0" width="4" height="40" rx="2" fill="#38bdf8" />
      <rect x="24" y="8" width="4" height="24" rx="2" fill="#818cf8" />
      <rect x="32" y="2" width="4" height="36" rx="2" fill="#38bdf8" />
      <rect x="40" y="12" width="4" height="16" rx="2" fill="#818cf8" />
      <rect x="48" y="6" width="4" height="28" rx="2" fill="#38bdf8" />
      <rect x="56" y="14" width="4" height="12" rx="2" fill="#818cf8" />
    </g>
    
    <rect x="80" y="65" width="170" height="30" rx="4" fill="#1e293b" />
    <text x="90" y="84" font-family="'Inter', sans-serif" font-size="9.5" fill="#38bdf8">✓ Matched with 3 students</text>

    <text x="16" y="122" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Intent: Peer Resource Matchmaking</text>
  </g>

  <!-- Smart OCR Recognition Box -->
  <g transform="translate(20, 234)">
    <rect x="0" y="0" width="270" height="144" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">OCR Note Scanner</text>
    
    <!-- Document Graphic -->
    <rect x="16" y="42" width="55" height="75" rx="3" fill="#1e293b" stroke="#334155" />
    <line x1="24" y1="55" x2="60" y2="55" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="24" y1="65" x2="55" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="24" y1="75" x2="62" y2="75" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="24" y1="85" x2="48" y2="85" stroke="#38bdf8" stroke-width="1.5" />
    
    <g transform="translate(85, 45)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">OCR_STATUS: PARSED</text>
      <text x="0" y="26" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">Extracted Equations &amp; Text</text>
      <rect x="0" y="38" width="165" height="20" rx="3" fill="#1e293b" />
      <text x="6" y="51" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa">tags: #calculus #midterms</text>
    </g>

    <text x="16" y="130" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Auto-indexing student study sheets</text>
  </g>

  <!-- Right Column: Virtual Cupboard & Community Resource Feed -->
  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="270" height="298" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Virtual Cupboard &amp; Feed</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748b">Community borrowing &amp; peer assistance</text>

    <!-- Resource item 1 -->
    <g transform="translate(16, 60)">
      <rect x="0" y="0" width="238" height="52" rx="4" fill="#111827" stroke="#1e293b" />
      <text x="12" y="20" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0">Arduino Mega 2560 Board</text>
      <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8">Available · 2 days loan · Engineering Bldg</text>
    </g>

    <!-- Resource item 2 -->
    <g transform="translate(16, 122)">
      <rect x="0" y="0" width="238" height="52" rx="4" fill="#111827" stroke="#1e293b" />
      <text x="12" y="20" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0">Discrete Math Textbook (Rosen)</text>
      <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#10b981">Shared by Sara K. · Library Desk</text>
    </g>

    <!-- Resource item 3 -->
    <g transform="translate(16, 184)">
      <rect x="0" y="0" width="238" height="52" rx="4" fill="#111827" stroke="#1e293b" />
      <text x="12" y="20" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0">TI-84 Graphing Calculator</text>
      <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#eab308">Reserved for Midterms · 1 day left</text>
    </g>

    <!-- Hackathon Prototype stamp -->
    <rect x="16" y="250" width="238" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-dasharray="3,3" />
    <text x="120" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">
      TWAIQATHON 48H PROTOTYPE
    </text>
  </g>
</svg>
