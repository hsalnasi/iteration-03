<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8c2c" />
    </linearGradient>
  </defs>

  <!-- Certificate Canvas -->
  <rect width="600" height="420" fill="url(#certBg)" stroke="#2b2b2f" stroke-width="2" />
  
  <!-- Ornate minimal borders -->
  <rect x="18" y="18" width="564" height="384" fill="none" stroke="#333" stroke-width="1" />
  <rect x="24" y="24" width="552" height="372" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />
  
  <!-- Corner accents -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <path d="M 28 40 L 40 40 L 40 28" />
    <path d="M 572 40 L 560 40 L 560 28" />
    <path d="M 28 380 L 40 380 L 40 392" />
    <path d="M 572 380 L 560 380 L 560 392" />
  </g>

  <!-- Header -->
  <text x="300" y="70" text-anchor="middle" font-family="'EB Garamond', serif" font-size="13" font-style="italic" fill="#aaa" letter-spacing="4">
    CERTIFICATE OF PARTICIPATION &amp; ACHIEVEMENT
  </text>
  
  <text x="300" y="115" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#ffffff" letter-spacing="1">
    AI HACKATHON 2026
  </text>
  
  <line x1="200" y1="135" x2="400" y2="135" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5" />

  <text x="300" y="170" text-anchor="middle" font-family="'EB Garamond', serif" font-size="14" font-style="italic" fill="#888">
    This is proudly awarded to
  </text>

  <text x="300" y="210" text-anchor="middle" font-family="'EB Garamond', serif" font-size="28" font-weight="bold" fill="#ffffff">
    [Your Name]
  </text>

  <text x="300" y="245" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#aaa" letter-spacing="0.5">
    Dar Al-Hekma University · Computer Science
  </text>

  <text x="300" y="280" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#777" width="400">
    for successfully building, submitting, and pitching an AI-assisted prototype
  </text>
  <text x="300" y="296" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#777">
    under 48-hour competitive sprint constraints.
  </text>

  <!-- Official Seal -->
  <g transform="translate(100, 340)">
    <circle cx="20" cy="0" r="24" fill="#141416" stroke="url(#goldGrad)" stroke-width="1.2" />
    <circle cx="20" cy="0" r="20" fill="none" stroke="#555" stroke-width="0.8" stroke-dasharray="2,2" />
    <text x="20" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="url(#goldGrad)">AI·2026</text>
  </g>

  <!-- Signature Lines -->
  <g transform="translate(380, 340)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#444" stroke-width="1" />
    <path d="M 10 -8 Q 40 -25 70 -5 T 120 -12" fill="none" stroke="#aaa" stroke-width="1.2" />
    <text x="70" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#666">HACKATHON COMMITTEE</text>
  </g>
</svg>
