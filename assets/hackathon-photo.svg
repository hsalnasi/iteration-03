<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="580" height="380" fill="none" stroke="#262626" stroke-width="1" />

  <!-- Hackathon Ambient Glow -->
  <circle cx="300" cy="220" r="180" fill="url(#screenGlow)" />

  <!-- Hackathon Workstation Desk Scene -->
  <!-- Laptop Main -->
  <g transform="translate(180, 150)">
    <!-- Screen frame -->
    <rect x="0" y="0" width="240" height="150" rx="6" fill="#1b1b1f" stroke="#444" stroke-width="1.5" />
    <rect x="8" y="8" width="224" height="134" rx="3" fill="#09090b" />
    
    <!-- Code on Screen -->
    <line x1="20" y1="24" x2="90" y2="24" stroke="#c4a7e7" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="24" x2="160" y2="24" stroke="#666" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="38" x2="110" y2="38" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="38" x2="180" y2="38" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="52" x2="150" y2="52" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="66" x2="130" y2="66" stroke="#c4a7e7" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="80" x2="80" y2="80" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="94" x2="170" y2="94" stroke="#888" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="108" x2="120" y2="108" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="122" x2="100" y2="122" stroke="#c4a7e7" stroke-width="3" stroke-linecap="round" />
    
    <!-- Base -->
    <path d="M -20 150 L 260 150 L 240 162 L -0 162 Z" fill="#2d2d34" stroke="#555" stroke-width="1" />
  </g>

  <!-- Coffee cup / Energy drink -->
  <g transform="translate(450, 240)">
    <rect x="0" y="0" width="28" height="42" rx="4" fill="#222" stroke="#555" stroke-width="1" />
    <rect x="4" y="6" width="20" height="12" fill="#c4a7e7" fill-opacity="0.3" />
    <line x1="14" y1="-8" x2="14" y2="0" stroke="#888" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Hackathon Badge / Lanyard -->
  <g transform="translate(90, 230)">
    <rect x="0" y="0" width="45" height="60" rx="3" fill="#18181b" stroke="#666" stroke-width="1" />
    <rect x="5" y="8" width="35" height="16" fill="#c4a7e7" fill-opacity="0.4" />
    <text x="22" y="19" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fff">HACK</text>
    <line x1="8" y1="32" x2="37" y2="32" stroke="#aaa" stroke-width="1.5" />
    <line x1="8" y1="40" x2="28" y2="40" stroke="#777" stroke-width="1.5" />
    <!-- Lanyard string -->
    <path d="M 22 0 L 22 -60" stroke="#c4a7e7" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Midterms study notes nearby -->
  <g transform="translate(90, 310)">
    <rect x="0" y="0" width="70" height="50" rx="2" fill="#1a1a1e" stroke="#444" stroke-width="1" transform="rotate(-6)" />
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="7" fill="#888" transform="rotate(-6)">Midterms</text>
    <text x="8" y="28" font-family="'JetBrains Mono', monospace" font-size="6" fill="#666" transform="rotate(-6)">Algorithms Prep</text>
  </g>

  <!-- Header Timestamp Tag -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="180" height="24" rx="2" fill="#000" stroke="#333" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10b981" />
    <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ddd">AI HACKATHON · SPRINT</text>
  </g>
  
  <text x="570" y="375" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#555">
    2:43 AM · VIBE CODING UNDER PRESSURE
  </text>
</svg>
